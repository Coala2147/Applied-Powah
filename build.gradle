plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.mod_group
base.archivesName = "${project.archives_base_name}-${project.mod_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

// MUST include forge/src/main/resources so META-INF/mods.toml is packaged
sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java', 'forge/src/main/java']
        }
        resources {
            srcDirs = ['common/src/main/resources', 'forge/src/main/resources']
        }
    }
}

repositories {
    // China mirrors first — avoid proxy when possible
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    maven { url = 'https://bmclapi2.bangbang93.com/maven' }
    maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
    // required for Forge userdev / toolchain
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Local jars in libs/ (Modrinth CDN) — more reliable than remote maven deobf
    implementation fg.deobf(files("libs/appliedenergistics2-forge-15.4.10.jar"))
    implementation fg.deobf(files("libs/Powah-5.0.11.jar"))
    implementation fg.deobf(files("libs/AppliedFlux-1.20-1.3.7-forge.jar"))

    // JEI optional at compile — @JeiPlugin class only loads when JEI is present
    compileOnly fg.deobf(files("libs/jei-1.20.1-forge-15.3.0.4.jar"))
}

def replaceProps = [
        minecraft_version: minecraft_version,
        forge_version    : forge_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_version      : mod_version,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProps
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProps
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'Coala',
                'Specification-Version' : project.mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor' : 'Coala',
        ])
    }
    finalizedBy 'reobfJar'
}

// Copy reobfuscated jar into releases/ — name = AppliedPowah-<mod_version>.jar (keep old jars)
tasks.register('copyToReleases', Copy) {
    dependsOn 'reobfJar'
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    into("${rootProject.projectDir}/releases")
    rename { "AppliedPowah-${project.mod_version}.jar" }
}
tasks.named('build').configure { dependsOn 'copyToReleases' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
