// ============ DRAFT (common) ============
// 与 loader 无关的共享源码。功能实现主体。
// 软依赖（AE2 / Powah / Applied Flux）用 compileOnlyApi 编译，运行时由各 loader 模块提供。
plugins {
    id 'dev.architectury.loom'
    id 'architectury'   // 若使用 Architectury 平台抽象（可选）
}

architectury {
    common(rootProject.path)
}

loom {
    // 1.20.1 映射：优先 parchment，或改用 yarn_mappings
    mappings provider: "parchment", versionStr: project.mappings_version
    // accessWidener 如需要再开：accessWidenerPath = file("src/main/resources/appliedpowah.accesswidener")
}

dependencies {
    // Minecraft + 映射
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // ===== 硬/软依赖 API（编译期可见，运行时由 loader 模块/游戏内 mod 提供）=====
    // AE2：1.20.1 用 CurseMaven/Modrinth 坐标（联网核验）
    compileOnlyApi "appeng:ae2-<loader>:${project.ae2_version}"     // TODO: 真实坐标
    // Powah
    compileOnlyApi "owmii:powah-<loader>:${project.powah_version}"  // TODO: 真实坐标
    // Applied Flux（FE 读取：FluxKey / EnergyType / IStorageService）
    compileOnlyApi "glodblock:appflux-<loader>:${project.appflux_version}" // TODO: 真实坐标
}

// 软依赖探测在源码 integration/ 包内用运行时 Class 检测，缺省跳过注册（见 ARCHITECTURE.md §3.3）
