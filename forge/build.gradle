// Forge 1.20.1 loader 入口（ATM9 目标）。仅放平台粘合代码。
plugins {
    id 'dev.architectury.loom'
}

architectury {
    platformForCompose()
}

loom {
    forge {
        // mixin 配置等按需追加
    }
}

dependencies {
    // 平台
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // 共享模块
    architectury project(path: ':common', transitive: false)

    // 软依赖（运行时需要提供；modRuntimeOnly 仅本机调试用）
    modImplementation "appeng:ae2-forge:${project.ae2_version}"        // TODO: 真实坐标
    modImplementation "owmii:powah-forge:${project.powah_version}"    // TODO: 真实坐标
    modImplementation "glodblock:appflux-forge:${project.appflux_version}" // TODO: 真实坐标
}
