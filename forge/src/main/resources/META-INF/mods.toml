modLoader="javafml"
loaderVersion="[47,)"
license="LGPL-3.0-only"
showAsResourcePack=false

[[mods]]
modId="applied_powah"
version="${mod_version}"
displayName="Applied Powah"
description="Applied Energistics 2 addon (server + client): high-density energy cells and full-block AE/ME Energizing Rods that extract energy from an ME network and supply Powah Energizing Orbs. Requires Minecraft 1.20.1 Forge 47+ and AE2."
authors="Coala"
displayTest="MATCH_VERSION"

# ======================== REQUIRED ========================
[[dependencies.applied_powah]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.applied_powah]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

# Hard prerequisite - cannot function without AE2
[[dependencies.applied_powah]]
modId="ae2"
mandatory=true
versionRange="[15.0.0,)"
ordering="AFTER"
side="BOTH"

# ======================== OPTIONAL ========================
# GuideME: AE2 15+ hard-depends guideme, and AE2 is our own hard prerequisite,
# so GuideME is transitively guaranteed present whenever this mod loads.
# Declared optional (not mandatory) because we never call GuideME directly —
# our guide pages are plain resources read through AE2's guidebook system
# (AppEng.openGuideAtAnchor / InitScreens). If GuideME were ever dropped from
# AE2, only the in-game ? button degrades (guide_missing message); no crash.
[[dependencies.applied_powah]]
modId="guideme"
mandatory=false
versionRange="[15.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.applied_powah]]
modId="powah"
mandatory=false
versionRange="[5.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.applied_powah]]
modId="appflux"
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
